# ==========================================================================
# Common configuration (shared across all profiles)
# Active profile is selected via SPRING_PROFILES_ACTIVE env var.
# Default profile = dev. Both dev and prod run MySQL 8; they differ only in
# credentials, logging and sample data. The test profile is for tests only.
# ==========================================================================
spring:
  application:
    name: course-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Luoi an toan chung cho N+1: khi Hibernate phai nap 1 quan he LAZY, no gom
        # toi da 20 khoa lai va nap bang MOT cau IN (...) thay vi 20 cau SELECT rieng.
        # Cac endpoint quan trong van nap tuong minh bang @EntityGraph / count query.
        default_batch_fetch_size: 20
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# --- OpenAPI / Swagger UI ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# --- Actuator (used by Docker healthcheck) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# --- Application-specific business defaults ---
app:
  info:
    title: He thong quan ly khoa hoc
    version: 1.0.0
  reminder:
    # Job nhac hoc: 8h sang moi ngay, nhac hoc vien khong hoat dong qua 7 ngay
    cron: "0 0 8 * * *"
    inactive-days: 7
