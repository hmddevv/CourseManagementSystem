<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống quản lý khóa học</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">🎓 Quản lý khóa học</div>
    <nav class="tabs">
        <button class="tab active" data-view="dashboard">Tổng quan</button>
        <button class="tab" data-view="courses">Khóa học</button>
        <button class="tab" data-view="enrollments">Ghi danh</button>
        <button class="tab" data-view="categories">Danh mục</button>
        <button class="tab" data-view="instructors">Giảng viên</button>
        <button class="tab" data-view="students">Học viên</button>
    </nav>
    <a class="swagger-link" href="/swagger-ui.html" target="_blank">API Docs ↗</a>
</header>

<main id="app">
    <!-- Dashboard -->
    <section id="view-dashboard" class="view active">
        <h1>Tổng quan hệ thống</h1>
        <div id="stat-cards" class="stat-grid"></div>
        <h2>Khóa học phổ biến</h2>
        <div id="popular-courses" class="popular-list"></div>
    </section>

    <!-- Courses -->
    <section id="view-courses" class="view">
        <div class="view-head">
            <h1>Khóa học</h1>
            <button class="btn primary" onclick="CourseUI.openForm()">+ Thêm khóa học</button>
        </div>
        <div class="filters">
            <input id="course-keyword" placeholder="Tìm theo tên/mô tả..." oninput="CourseUI.reload()">
            <select id="course-status" onchange="CourseUI.reload()">
                <option value="">-- Trạng thái --</option>
                <option value="DRAFT">DRAFT</option>
                <option value="PUBLISHED">PUBLISHED</option>
                <option value="ARCHIVED">ARCHIVED</option>
            </select>
            <select id="course-level" onchange="CourseUI.reload()">
                <option value="">-- Trình độ --</option>
                <option value="BEGINNER">BEGINNER</option>
                <option value="INTERMEDIATE">INTERMEDIATE</option>
                <option value="ADVANCED">ADVANCED</option>
            </select>
            <select id="course-sort" onchange="CourseUI.reload()">
                <option value="createdAt,desc">Mới nhất</option>
                <option value="price,asc">Giá tăng dần</option>
                <option value="price,desc">Giá giảm dần</option>
                <option value="title,asc">Tên A-Z</option>
            </select>
        </div>
        <div id="courses-table"></div>
        <div id="courses-pager" class="pager"></div>
    </section>

    <!-- Enrollments -->
    <section id="view-enrollments" class="view">
        <div class="view-head"><h1>Ghi danh</h1>
            <button class="btn primary" onclick="EnrollUI.openForm()">+ Ghi danh mới</button>
        </div>
        <div class="filters">
            <select id="enroll-course" onchange="EnrollUI.reload()">
                <option value="">-- Chọn khóa học để xem --</option>
            </select>
        </div>
        <div id="enroll-table"></div>
    </section>

    <!-- Categories -->
    <section id="view-categories" class="view">
        <div class="view-head"><h1>Danh mục</h1>
            <button class="btn primary" onclick="CategoryUI.openForm()">+ Thêm danh mục</button>
        </div>
        <div id="categories-table"></div>
    </section>

    <!-- Instructors -->
    <section id="view-instructors" class="view">
        <div class="view-head"><h1>Giảng viên</h1>
            <button class="btn primary" onclick="InstructorUI.openForm()">+ Thêm giảng viên</button>
        </div>
        <div id="instructors-table"></div>
    </section>

    <!-- Students -->
    <section id="view-students" class="view">
        <div class="view-head"><h1>Học viên</h1>
            <button class="btn primary" onclick="StudentUI.openForm()">+ Thêm học viên</button>
        </div>
        <div id="students-table"></div>
    </section>
</main>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay" onclick="Modal.close(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
            <h3 id="modal-title">Form</h3>
            <button class="modal-close" onclick="Modal.close()">×</button>
        </div>
        <form id="modal-form" class="modal-body"></form>
        <div class="modal-foot">
            <button class="btn" onclick="Modal.close()">Hủy</button>
            <button class="btn primary" onclick="Modal.submit()">Lưu</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
