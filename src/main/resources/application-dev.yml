# ==========================================================================
# DEV profile - H2 in-memory database.
# Zero external dependency: run `mvnw spring-boot:run` and it just works.
# Data is re-seeded on every startup by DataSeeder.
# ==========================================================================
spring:
  datasource:
    url: jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.university.coursemanagement: DEBUG
    org.hibernate.SQL: DEBUG
