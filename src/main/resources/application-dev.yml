# ==========================================================================
# DEV profile - MySQL 8, the same database engine as prod.
#
# Dev and prod differ only in logging level, SQL echo and sample-data
# seeding. Engine, JDBC driver, SQL dialect and schema strategy are
# identical, so behaviour observed here is the behaviour in production.
#
# Start the database:  docker compose up -d mysql
# Run the app:         mvnw spring-boot:run
# ==========================================================================
spring:
  datasource:
    # Port 3307 is the host-side mapping of the MySQL container (docker-compose.yml)
    url: ${DB_URL:jdbc:mysql://localhost:3307/coursedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:course_user}
    password: ${DB_PASSWORD:course_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.university.coursemanagement: DEBUG
    org.hibernate.SQL: DEBUG
